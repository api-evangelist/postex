aid: postex
name: PostEx
description: >-
  PostEx is a Pakistani e-commerce logistics, courier, and fintech platform that
  provides cash-on-delivery parcel fulfilment with instant upfront payments to
  online merchants, alongside a business suite for expense management, working-
  capital financing, and the XPay payment gateway. Merchants and order-
  management systems integrate with PostEx through its merchant Order
  Integration API (https://api.postex.pk) to book shipments, look up operational
  cities and pickup addresses, track parcels, and reconcile orders. This profile
  was enriched by API Evangelist by live-probing the production API host, which
  confirmed a real merchant integration surface authenticated with a token
  request header. PostEx is backed by 500 Global.
